<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="{% if page.url == '/' %}home-shell{% else %}wrapper{% endif %}">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        const currentTheme = document.documentElement.dataset.theme;
        themeToggle.setAttribute("aria-pressed", String(currentTheme === "dark"));
        themeToggle.textContent = currentTheme === "dark" ? "Dark theme on" : "Dark theme off";

        themeToggle.addEventListener("click", () => {
          const root = document.documentElement;
          const theme = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
          themeToggle.textContent = theme === "dark" ? "Dark theme on" : "Dark theme off";

          try {
            localStorage.setItem("riyabisht-theme", theme);
          } catch {
            // The theme still works for this page when storage is unavailable.
          }
        });
      }
    </script>

  </body>

</html>
