<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Riya Bisht, home">
      <span class="brand-mark" aria-hidden="true">RB</span>
      <span class="brand-name">Riya Bisht<span>Software Engineer</span></span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" class="menu-toggle">
        <span class="menu-label">Menu</span>
        <span class="menu-icon" aria-hidden="true"><span></span><span></span></span>
      </label>
      <div class="nav-links">
        <a class="page-link" href="{{ '/' | relative_url }}">Home</a>
        <a class="page-link" href="{{ '/projects/' | relative_url }}">Projects</a>
        <a class="page-link" href="{{ '/blog/' | relative_url }}">Blog</a>
        <a class="page-link" href="{{ '/about/' | relative_url }}">About</a>
        <div class="theme-switcher">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme: System" aria-expanded="false" aria-controls="theme-menu">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <g data-theme-icon="system">
                <rect x="3" y="4" width="18" height="14" rx="2"></rect>
                <path d="M8 21h8m-4-3v3"></path>
              </g>
              <g data-theme-icon="light" hidden>
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
              </g>
              <g data-theme-icon="dark" hidden>
                <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path>
              </g>
            </svg>
          </button>
          <div class="theme-menu" id="theme-menu" role="group" aria-label="Theme preference" hidden>
            <button class="theme-option" type="button" data-theme-option="system" aria-pressed="false">System</button>
            <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false">Light</button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false">Dark</button>
          </div>
        </div>
        <a class="nav-contact" href="mailto:{{ site.author.email }}">Let’s talk <span aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </div>
</header>
