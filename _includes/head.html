<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      const root = document.documentElement;
      const colorPreference = window.matchMedia("(prefers-color-scheme: dark)");
      let mode = "system";
      try {
        const savedTheme = localStorage.getItem("riyabisht-theme");
        if (savedTheme === "system" || savedTheme === "light" || savedTheme === "dark") {
          mode = savedTheme;
        }
      } catch {
        // Storage can be unavailable in restricted browser contexts.
      }

      root.dataset.themeMode = mode;
      const applyTheme = () => {
        const selectedMode = root.dataset.themeMode;
        const theme = selectedMode === "system"
          ? (colorPreference.matches ? "dark" : "light")
          : selectedMode;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      };

      applyTheme();
      const onColorPreferenceChange = () => {
        if (root.dataset.themeMode === "system") {
          applyTheme();
        }
      };
      if (colorPreference.addEventListener) {
        colorPreference.addEventListener("change", onColorPreferenceChange);
      } else {
        colorPreference.addListener(onColorPreferenceChange);
      }
    })();
  </script>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  {%- include custom-head.html -%}
  
</head>
